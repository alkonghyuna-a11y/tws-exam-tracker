<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="투운사 회독 관리 앱 아이콘">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A5183"/>
      <stop offset="1" stop-color="#1B3A5E"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1D33" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 시험지 -->
  <g filter="url(#sh)">
    <path d="M126 96h180l80 80v240a24 24 0 0 1-24 24H150a24 24 0 0 1-24-24V120a24 24 0 0 1 24-24z" fill="#FBFCFE"/>
    <path d="M306 96l80 80h-64a16 16 0 0 1-16-16V96z" fill="#D6E0EC"/>
  </g>

  <!-- 상단 제목줄 -->
  <rect x="164" y="146" width="104" height="14" rx="7" fill="#22456F"/>
  <rect x="164" y="176" width="66" height="10" rx="5" fill="#AEBCCE"/>

  <!-- OMR 마킹 행 3줄 -->
  <g>
    <!-- 1행: 2번 마킹 -->
    <rect x="164" y="222" width="20" height="10" rx="5" fill="#C6D1DF"/>
    <circle cx="216" cy="227" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>
    <circle cx="262" cy="227" r="14" fill="#22456F"/>
    <circle cx="308" cy="227" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>
    <circle cx="354" cy="227" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>

    <!-- 2행: 4번 마킹 -->
    <rect x="164" y="285" width="20" height="10" rx="5" fill="#C6D1DF"/>
    <circle cx="216" cy="290" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>
    <circle cx="262" cy="290" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>
    <circle cx="308" cy="290" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>
    <circle cx="354" cy="290" r="14" fill="#22456F"/>

    <!-- 3행: 1번 마킹 -->
    <rect x="164" y="348" width="20" height="10" rx="5" fill="#C6D1DF"/>
    <circle cx="216" cy="353" r="14" fill="#22456F"/>
    <circle cx="262" cy="353" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>
    <circle cx="308" cy="353" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>
    <circle cx="354" cy="353" r="14" fill="none" stroke="#B9C6D6" stroke-width="6"/>
  </g>

  <!-- 채점 체크 -->
  <g>
    <circle cx="366" cy="392" r="66" fill="#0C7561"/>
    <path d="M336 392l22 23 42-49" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
